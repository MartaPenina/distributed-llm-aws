# Prometheus config for the bastion host (runs alongside AnythingLLM,
# no separate monitoring host). Receives metrics from Grafana Agent
# (LLM1/LLM2) via remote_write.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]