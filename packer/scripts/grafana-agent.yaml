# Grafana Agent config: scrapes this instance's own metrics (via node_exporter
# on localhost:9100) and forwards them to Prometheus on the bastion host
# (10.0.0.5 — stable private IP, fixed via Terraform private_ip attribute).

server:
  log_level: info

metrics:
  global:
    scrape_interval: 15s
  configs:
    - name: integrations
      scrape_configs:
        - job_name: node_exporter
          static_configs:
            - targets: ["localhost:9100"]
              labels:
                instance: "${HOSTNAME}"
      remote_write:
        - url: "http://10.0.0.5:9090/api/v1/write"