# Grafana Agent config: scrapes this instance's own metrics (via node_exporter
# on localhost:9100) and forwards them to Prometheus on the monitoring host.
# PLACEHOLDER: replace <MONITORING_HOST_PRIVATE_IP> once the monitoring host
# exists (after its Terraform module + AMI are built) — this can't be filled
# in yet since that host doesn't exist.
 
server:
  log_level: info
 
metrics:
  global:
    scrape_interval: 15s
  configs:
    - name: integrations
      scrape_configs:
        - job_name: node_exporter
          static_configs:
            - targets: ["localhost:9100"]
              labels:
                instance: "${HOSTNAME}"
      remote_write:
        - url: "http://<MONITORING_HOST_PRIVATE_IP>:9090/api/v1/write"