name: Terraform

on:
  push:
    branches: [main]
    paths: ["terraform/**", "lambda/**", ".github/workflows/terraform.yml"]
  pull_request:
    branches: [main]
    paths: ["terraform/**", "lambda/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

env:
  TF_VERSION: "1.12.2"
  AWS_REGION: eu-central-1
  AWS_PROFILE_NAME: distributed-llm-aws-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  plan:
    needs: validate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform } }
    env:
      # Secrets -> Terraform variables (var.alert_email, var.bastion_allowed_cidrs).
      # Non-secret config is committed in terraform/dev.auto.tfvars.
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_bastion_allowed_cidrs: ${{ secrets.BASTION_ALLOWED_CIDRS }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      # backend.tf and provider.tf use a named AWS profile
      - name: Configure AWS profile
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$KEY_ID" --profile "$AWS_PROFILE_NAME"
          aws configure set aws_secret_access_key "$SECRET_KEY" --profile "$AWS_PROFILE_NAME"
          aws configure set region "$AWS_REGION" --profile "$AWS_PROFILE_NAME"
      - name: Terraform init
        run: terraform init
      - name: Terraform plan
        run: terraform plan -out=tfplan
      # Saved plan + Lambda zip built during plan, so apply uses exactly what was reviewed
      - name: Upload plan
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            terraform/tfplan
            lambda/discord_notifier.zip
          retention-days: 1

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Manual approval: Settings -> Environments -> production -> Required reviewers
    environment: production
    defaults: { run: { working-directory: terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - name: Configure AWS profile
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$KEY_ID" --profile "$AWS_PROFILE_NAME"
          aws configure set aws_secret_access_key "$SECRET_KEY" --profile "$AWS_PROFILE_NAME"
          aws configure set region "$AWS_REGION" --profile "$AWS_PROFILE_NAME"
      - name: Download plan
        uses: actions/download-artifact@v4
        with: { name: tfplan, path: . }
      - name: Terraform init
        run: terraform init
      # Variables are stored inside the saved plan, no TF_VAR_* needed here
      - name: Terraform apply
        run: terraform apply tfplan
